<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Enza Deuscit, home">
      <img src="{{ '/images/site/logo-enza.jpg' | relative_url }}" alt="Logo Enza Deuscit">
      <span>Enza Deuscit<small>Psicologa · Psicoterapeuta</small></span>
    </a>
    <button class="menu-toggle" aria-expanded="false" aria-controls="main-menu"><span></span><span></span><span></span><i class="sr-only">Apri menu</i></button>
    <nav id="main-menu" class="main-nav" aria-label="Navigazione principale">
      <a{% if page.url == '/' %} class="active"{% endif %} href="{{ '/' | relative_url }}">Home</a>
      <a{% if page.url == '/chi-sono.html' %} class="active"{% endif %} href="{{ '/chi-sono.html' | relative_url }}">Chi sono</a>
      <a{% if page.url == '/approccio.html' %} class="active"{% endif %} href="{{ '/approccio.html' | relative_url }}">Approccio</a>
      <a{% if page.url contains '/appunti' %} class="active"{% endif %} href="{{ '/appunti/' | relative_url }}">Appunti</a>
      <a{% if page.url contains '/storie' %} class="active"{% endif %} href="{{ '/storie/' | relative_url }}">Storie che scaldano il cuore</a>
      <a class="nav-contact{% if page.url == '/contatti.html' %} active{% endif %}" href="{{ '/contatti.html' | relative_url }}">Contatti</a>
    </nav>
  </div>
</header>
