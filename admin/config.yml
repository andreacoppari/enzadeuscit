# local_backend: true

# backend:
#   name: proxy
#   proxy_url: http://localhost:8081/api/v1
#   branch: main

backend:
  name: github
  repo: andreacoppari/enzadeuscit
  branch: main
  site_domain: enzadeuscit.it

locale: it
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "ordine_appunti"
    label: "Ordina Appunti"
    files:
      - file: "_data/appunti_order.yml"
        label: "Ordine Appunti"
        name: "appunti_order"
        fields:
          - label: "Appunti di psicologia"
            name: "appunti"
            widget: "order_sync"
            source_path: "/appunti/"
            hint: "Premi Sincronizza, poi Salva. Trascina le righe per riordinarle."

  - name: "ordine_storie"
    label: "Ordina Storie"
    files:
      - file: "_data/storie_order.yml"
        label: "Ordine Storie"
        name: "storie_order"
        fields:
          - label: "Storie che scaldano il cuore"
            name: "storie"
            widget: "order_sync"
            source_path: "/storie/"
            hint: "Premi Sincronizza, poi Salva. Trascina le righe per riordinarle."

  - name: "appunti"
    label: "Appunti di psicologia"
    label_singular: "Appunto"
    folder: "_appunti"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["title"]
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Data di inserimento", name: "created_at", widget: "datetime", default: "{{now}}" }
      - { label: "Descrizione breve", name: "summary", widget: "text", required: false }
      - { label: "Immagine", name: "image", widget: "image", required: false }
      - { label: "Testo", name: "body", widget: "markdown" }

  - name: "storie"
    label: "Storie che scaldano il cuore"
    label_singular: "Storia"
    folder: "_storie"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["title"]
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Data di inserimento", name: "created_at", widget: "datetime", default: "{{now}}" }
      - { label: "Descrizione breve", name: "summary", widget: "text", required: false }
      - { label: "Immagine", name: "image", widget: "image", required: false }
      - { label: "Testo", name: "body", widget: "markdown" }
