---
layout: default
---
<article class="article-page">
  <header class="article-hero">
    <div class="container article-hero-grid">
      <div>
        <a class="back-link" href="{{ page.section_url | relative_url }}">← {{ page.section }}</a>
        <h1>{{ page.title }}</h1>
      </div>
      {% if page.image %}<figure class="article-cover"><img src="{{ page.image | relative_url }}" alt=""></figure>{% endif %}
    </div>
  </header>
  <div class="container article-content">{{ content }}</div>
  <nav class="container article-end" aria-label="Torna alla raccolta"><a class="button button-outline" href="{{ page.section_url | relative_url }}">Torna a {{ page.section }}</a></nav>
</article>
